<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 중학교 수학 자료실</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  --bg:#F7F7F3;
  --panel:#FFFFFF;
  --ink:#1B1E2A;
  --ink-soft:#6B7280;
  --line:#E7E5DD;
  --hover:#F1F0EA;
  --concept:#3B6EA5;
  --practice:#B4700A;
  --total:#2F8F62;
  --game:#7C4FBF;
  --activity:#A6473C;
  --radius:14px;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
}
*,*::before,*::after{ box-sizing:inherit; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:var(--font);
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
a{ color:inherit; }
button{ font-family:inherit; }
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

.wrap{ max-width:1180px; margin:0 auto; padding:36px 22px 80px; }

.hero{ padding:0 0 22px; border-bottom:1px solid var(--line); margin-bottom:26px; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.hero h1{ font-size:25px; font-weight:700; line-height:1.3; margin:0 0 16px; letter-spacing:-0.01em; }
.stat-row{ display:flex; gap:22px; flex-wrap:wrap; }
.stat{ display:flex; align-items:baseline; gap:6px; }
.stat b{ font-size:17px; font-weight:700; }
.stat span{ font-size:12.5px; color:var(--ink-soft); }
.refresh-btn{
  border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:9px;
  padding:8px 14px; font-size:12.5px; font-weight:600; cursor:pointer;
}
.hero-actions{ display:flex; gap:8px; align-items:center; }

.layout{ display:grid; grid-template-columns:1fr 240px; gap:28px; align-items:start; }
@media (max-width:900px){ .layout{ grid-template-columns:1fr; } }

.content-panel{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 18px 22px;
}
.content-panel h2{ font-size:15px; margin:0 0 4px; font-weight:700; }
.add-link-btn{
  display:inline-block; text-decoration:none; border:1px solid var(--ink); background:var(--ink); color:var(--bg);
  border-radius:9px; padding:8px 14px; font-size:12.5px; font-weight:600;
}
.add-link-btn:hover{ opacity:0.85; }

.grade-grid{ display:grid; gap:18px; margin-top:16px; grid-template-columns:repeat(3, 1fr); }
@media (max-width:820px){ .grade-grid{ grid-template-columns:1fr; } }
.grade-col h3{ font-size:13px; margin:0 0 10px; font-weight:700; color:var(--ink-soft); }
.unit-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px; }

.unit-link{
  display:flex; align-items:center; gap:9px; padding:11px 12px; border-radius:11px;
  border:1px solid var(--line); background:var(--panel); text-decoration:none;
}
.unit-link:hover{ background:var(--hover); border-color:var(--cat-color); }
.dot{ width:8px; height:8px; border-radius:50%; background:var(--cat-color); flex-shrink:0; }
.cat-name{ font-size:11px; font-weight:700; color:var(--cat-color); min-width:26px; flex-shrink:0; }
.unit-text{ font-size:13.5px; font-weight:600; color:var(--ink); flex:1; }

.empty{ color:var(--ink-soft); font-size:13px; padding:16px; border:1px dashed var(--line); border-radius:var(--radius); }
.loading{ color:var(--ink-soft); font-size:13px; padding:16px; }
.error-box{ color:#C0392B; font-size:13px; padding:16px; border:1px solid #E8B4AE; border-radius:var(--radius); background:#FBEEEC; }

.sidebar{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px;
  position:sticky; top:16px;
}
.sidebar h2{ font-size:13.5px; margin:0 0 4px; font-weight:700; }
.sidebar .sub{ font-size:11.5px; color:var(--ink-soft); margin:0 0 12px; }
.site-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px; }
.site-item{ border:1px solid var(--line); border-radius:10px; }
.site-item a{
  display:block; width:100%; padding:10px 11px; text-decoration:none; font-size:13px; font-weight:500;
  color:var(--ink); border-radius:10px;
}
.site-item a:hover{ background:var(--hover); }

footer{ margin-top:26px; font-size:11.5px; color:var(--ink-soft); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div>
      <h1>2026 중학교 수학 자료실</h1>
      <div class="stat-row" id="stat-row">
        <div class="stat"><b>&hellip;</b><span>불러오는 중</span></div>
      </div>
    </div>
    <div class="hero-actions">
      <a class="add-link-btn" href="https://docs.google.com/forms/d/e/1FAIpQLSdPssFAX07MiTjq_rbMS1PVD8QwAWSuZ-eGw-cBd0iM2WEZWQ/viewform" target="_blank" rel="noopener">내용 입력</a>
      <button class="refresh-btn" id="refresh-btn" type="button">↻ 새로고침</button>
    </div>
  </header>

  <div class="layout">
    <main>
      <div class="content-panel">
        <h2>학년별 단원</h2>
        <div id="units-area"><p class="loading">자료를 불러오는 중이에요...</p></div>
      </div>
    </main>

    <aside class="sidebar">
      <h2>유용한 사이트</h2>
      <p class="sub">수업에 자주 쓰는 외부 도구 모음</p>
      <ul class="site-list" id="site-list"><li class="empty">불러오는 중...</li></ul>
    </aside>
  </div>

  <footer>단원·사이트는 위 "+ 자료 추가" 버튼 하나로 함께 제출돼요. 반영까지 몇 분 걸릴 수 있어요.</footer>
</div>

<script>
(function(){
  var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSnPDY2QKCTbq-RQ8VwarlL_XtJl3dvcemQdkoplUiK7LuDyewJvtQ9grIeUxZyoouBNeO_GcsYnwZJ/pub?gid=312877217&single=true&output=csv";

  var CATEGORIES = [
    { key:'concept', label:'개념', color:'var(--concept)' },
    { key:'practice', label:'연습', color:'var(--practice)' },
    { key:'total', label:'종합', color:'var(--total)' },
    { key:'game', label:'게임', color:'var(--game)' }
  ];
  var GRADES = ['1','2','3'];
  var SITE_KEYWORD = '사이트';

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function naturalCompare(a, b){
    var re = /^(\d+(\.\d+)?)/;
    var ma = a.match(re), mb = b.match(re);
    if (ma && mb) {
      var na = parseFloat(ma[1]), nb = parseFloat(mb[1]);
      if (na !== nb) return na - nb;
    } else if (ma && !mb) { return -1; }
    else if (!ma && mb) { return 1; }
    return a.localeCompare(b, 'ko');
  }

  function normalizeUrl(u){
    u = (u || '').trim();
    if (!u) return '';
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  }

  function findCol(headers, keyword){
    for (var i=0;i<headers.length;i++){
      if (headers[i] && headers[i].indexOf(keyword) !== -1) return i;
    }
    return -1;
  }

  function categoryFromLabel(label){
    label = (label || '').trim();
    for (var i=0;i<CATEGORIES.length;i++){
      if (CATEGORIES[i].label === label) return CATEGORIES[i];
    }
    return { key:'etc', label: label || '기타', color:'var(--ink-soft)' };
  }

  function gradeFromLabel(label){
    var m = (label || '').match(/\d/);
    return m ? m[0] : null;
  }

  function renderSites(sites){
    var html = '';
    if (sites.length === 0){
      html = '<div class="empty">등록된 사이트가 없어요.</div>';
    } else {
      sites.slice().sort(function(a,b){ return a.title.localeCompare(b.title, 'ko'); }).forEach(function(s){
        html += '<li class="site-item"><a href="' + escapeHtml(s.url) + '">' + escapeHtml(s.title) + '</a></li>';
      });
    }
    document.getElementById('site-list').innerHTML = html;
  }

  function renderUnits(entries){
    var total = entries.length;
    var statHtml = '<div class="stat"><b>' + total + '</b><span>등록된 자료</span></div>';
    var byGrade = {};
    GRADES.forEach(function(g){ byGrade[g] = []; });
    entries.forEach(function(e){ if (byGrade[e.grade]) byGrade[e.grade].push(e); });
    GRADES.forEach(function(g){
      statHtml += '<div class="stat"><b>' + byGrade[g].length + '</b><span>' + g + '학년</span></div>';
    });
    document.getElementById('stat-row').innerHTML = statHtml;

    var html = '<div class="grade-grid">';
    GRADES.forEach(function(g){
      var list = byGrade[g].slice().sort(function(a,b){
        var c = naturalCompare(a.unit, b.unit);
        if (c !== 0) return c;
        return a.category.label.localeCompare(b.category.label);
      });
      html += '<div class="grade-col"><h3>' + g + '학년</h3>';
      if (list.length === 0){
        html += '<div class="empty">아직 등록된 단원이 없어요.</div>';
      } else {
        html += '<ul class="unit-list">';
        list.forEach(function(e){
          html += '<li><a class="unit-link" style="--cat-color:' + e.category.color + '" href="' + escapeHtml(e.url) + '">' +
            '<span class="dot" style="--cat-color:' + e.category.color + '"></span>' +
            '<span class="cat-name" style="--cat-color:' + e.category.color + '">' + escapeHtml(e.category.label) + '</span>' +
            '<span class="unit-text">' + escapeHtml(e.unit) + '</span>' +
            '</a></li>';
        });
        html += '</ul>';
      }
      html += '</div>';
    });
    html += '</div>';
    document.getElementById('units-area').innerHTML = html;
  }

  function showError(msg){
    document.getElementById('units-area').innerHTML = '<div class="error-box">' + escapeHtml(msg) + '</div>';
    document.getElementById('stat-row').innerHTML = '<div class="stat"><span>불러오기 실패</span></div>';
  }

  function load(){
    document.getElementById('units-area').innerHTML = '<p class="loading">자료를 불러오는 중이에요...</p>';
    var bust = CSV_URL + (CSV_URL.indexOf('?') === -1 ? '?' : '&') + '_=' + Date.now();
    fetch(bust)
      .then(function(res){
        if (!res.ok) throw new Error('네트워크 오류 (' + res.status + ')');
        return res.text();
      })
      .then(function(text){
        var parsed = Papa.parse(text, { header:true, skipEmptyLines:true });
        var headers = parsed.meta.fields || [];
        var gradeCol = findCol(headers, '학년');
        var catCol = findCol(headers, '분류');
        var unitCol = findCol(headers, '단원명');
        var urlCol = findCol(headers, '링크');
        if (gradeCol === -1 || catCol === -1 || unitCol === -1 || urlCol === -1){
          throw new Error('시트의 열 이름을 확인할 수 없어요. 폼 질문 제목을 다시 확인해 주세요.');
        }
        var gradeKey = headers[gradeCol], catKey = headers[catCol], unitKey = headers[unitCol], urlKey = headers[urlCol];
        var entries = [];
        var sites = [];
        (parsed.data || []).forEach(function(row){
          var gradeLabel = (row[gradeKey] || '').trim();
          var unit = (row[unitKey] || '').trim();
          var url = normalizeUrl(row[urlKey]);
          if (!unit || !url) return;
          if (gradeLabel.indexOf(SITE_KEYWORD) !== -1){
            sites.push({ title: unit, url: url });
            return;
          }
          var grade = gradeFromLabel(gradeLabel);
          if (!grade) return;
          entries.push({ grade: grade, unit: unit, url: url, category: categoryFromLabel(row[catKey]) });
        });
        renderUnits(entries);
        renderSites(sites);
      })
      .catch(function(err){
        showError('자료를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 해주세요. (' + err.message + ')');
      });
  }

  document.getElementById('refresh-btn').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
